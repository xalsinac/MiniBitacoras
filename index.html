<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MiniBitácora</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" id="theme-color-meta" content="#f4f7f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Librería Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --lia-color: #fff0f2; --lia-dark: #ff758f; --lia-gradient: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            --max-color: #e3f2fd; --max-dark: #4fc3f7; --max-gradient: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            --bg-color: #f4f7f6; --text-main: #2d3436; --text-muted: #636e72; --card-bg: #ffffff;
            --input-bg: #ffffff; --border-color: #dfe6e9; --timeline-line: #b2bec3; --shadow: 0 8px 20px rgba(0,0,0,0.06);
        }
        html.dark-mode {
            --lia-color: #3b2a2d; --lia-dark: #ff477e; --lia-gradient: linear-gradient(135deg, #5c3a41 0%, #3b2a2d 100%);
            --max-color: #1a2a32; --max-dark: #29b6f6; --max-gradient: linear-gradient(135deg, #2a4b52 0%, #1a2a32 100%);
            --bg-color: #121212; --text-main: #f5f6fa; --text-muted: #a4b0be; --card-bg: #1e1e1e;
            --input-bg: #2d3436; --border-color: #444; --timeline-line: #444; --shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        html, body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 0; 
            min-height: 100dvh;
        }
        body { 
            padding-bottom: calc(90px + env(safe-area-inset-bottom)); 
            transition: background-color 0.3s, color 0.3s; 
        }
        ::placeholder {
            color: var(--text-muted);
            opacity: 0.55;
            font-size: 0.95rem;
        }
        .hidden { display: none !important; }
        .screen { padding: 20px; max-width: 600px; margin: 0 auto; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #scroll-indicator { position: fixed; top: 75px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.7); color: white; padding: 6px 15px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; z-index: 1000; opacity: 0; transition: opacity 0.3s; pointer-events: none; backdrop-filter: blur(5px); }
        #scroll-indicator.visible { opacity: 1; }
        body.dark-mode #scroll-indicator { background: rgba(255,255,255,0.2); color: #fff; }
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 0; background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb); background-size: 400% 400%; animation: gradientBG 10s ease infinite; }
        @keyframes gradientBG { 0% {background-position: 0% 50%;} 50% {background-position: 100% 50%;} 100% {background-position: 0% 50%;} }
        .login-card { background: var(--card-bg); padding: 40px 30px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center; width: 80%; max-width: 350px; }
        .login-card h2 { margin-top: 0; font-size: 1.8rem; }
        .login-card p { color: var(--text-muted); margin-bottom: 25px; }
        .login-card input { padding: 15px; font-size: 1.2rem; border-radius: 12px; border: 2px solid var(--border-color); text-align: center; margin-bottom: 20px; width: 100%; box-sizing: border-box; background: var(--input-bg); color: var(--text-main); }
        .login-card button { padding: 15px; width: 100%; font-size: 1.1rem; border-radius: 12px; border: none; background: linear-gradient(90deg, var(--lia-dark), var(--max-dark)); color: white; font-weight: bold; cursor: pointer; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-top: 10px;}
        header h1 { margin: 0; font-size: 2.2rem; text-align: center; flex-grow: 1; background: linear-gradient(90deg, var(--lia-dark), var(--max-dark)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .header-title-small { font-size: 1.5rem; text-align: center; flex-grow: 1; color: var(--text-main); margin: 0;}
        .icon-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-main); padding: 5px; }
        .search-container { position: relative; margin-bottom: 25px; }
        .search-input { width: 100%; padding: 15px 20px 15px 45px; border-radius: 20px; border: 1px solid var(--border-color); font-size: 1.05rem; box-sizing: border-box; background: var(--card-bg); color: var(--text-main); box-shadow: var(--shadow); font-family: inherit; }
        .search-icon { position: absolute; left: 15px; top: 15px; font-size: 1.2rem; opacity: 0.5; }
        #search-results { background: var(--card-bg); border-radius: 15px; margin-top: 10px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .search-result-item { padding: 15px; border-bottom: 1px solid var(--border-color); cursor: pointer; }
        .big-card { background: var(--card-bg); border-radius: 20px; padding: 30px 20px; margin-bottom: 20px; box-shadow: var(--shadow); text-align: center; cursor: pointer; border-bottom: 5px solid transparent; }
        .big-card#card-timeline { border-bottom-color: var(--lia-dark); }
        .big-card#card-quotes { border-bottom-color: var(--max-dark); }
        .big-card h2 { margin: 0 0 10px 0; font-size: 1.6rem; }
        .big-card p { color: var(--text-muted); margin: 0;}
        #fab { position: fixed; bottom: 30px; right: 30px; width: 65px; height: 65px; border-radius: 50%; background: linear-gradient(135deg, var(--lia-dark), var(--max-dark)); color: white; font-size: 2.5rem; border: none; box-shadow: 0 8px 20px rgba(0,0,0,0.3); cursor: pointer; z-index: 1000; display: flex; justify-content: center; align-items: center; }
        .timeline { position: relative; max-width: 100%; margin: 0 auto; padding-top: 10px; }
        .timeline::after { content: ''; position: absolute; width: 4px; background-color: var(--timeline-line); top: 0; bottom: 0; left: 50%; margin-left: -2px; border-radius: 2px; }
        .container-tl { padding: 10px 20px; position: relative; width: 50%; box-sizing: border-box; }
        .container-tl.lia { left: 0; } .container-tl.max { left: 50%; }
        .container-tl::after { content: ''; position: absolute; width: 16px; height: 16px; border-radius: 50%; background-color: var(--card-bg); border: 4px solid var(--timeline-line); top: 15px; z-index: 1; }
        .lia::after { right: -12px; border-color: var(--lia-dark); } .max::after { left: -12px; border-color: var(--max-dark); }
        .content-tl { padding: 15px; border-radius: 15px; position: relative; box-shadow: var(--shadow); background: var(--card-bg); }
        .lia .content-tl { border-left: 5px solid var(--lia-dark); background-color: var(--lia-color); }
        .max .content-tl { border-left: 5px solid var(--max-dark); background-color: var(--max-color); }
        .date-badge { font-size: 0.85rem; font-weight: bold; margin-bottom: 8px; color: var(--text-muted); padding-right: 20px; }
        .quotes-grid { display: flex; flex-direction: column; gap: 15px; }
        .quote-card { padding: 20px; border-radius: 15px; position: relative; font-size: 1.15rem; font-style: italic; box-shadow: var(--shadow); line-height: 1.4; }
        .quote-card.lia { background: var(--lia-gradient); color: #fff; }
        .quote-card.max { background: var(--max-gradient); color: #2d3436; }
        body.dark-mode .quote-card.max { color: #fff; }
        .quote-author { font-size: 0.9rem; font-weight: bold; margin-top: 15px; text-align: right; font-style: normal; }

        /* --- MENÚ DE ACCIONES (TRES PUNTOS) --- */
        .card-menu-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: inherit;
            opacity: 0.65;
            padding: 4px 8px;
            line-height: 1;
            border-radius: 8px;
            z-index: 5;
        }
        .card-menu-btn:active {
            opacity: 1;
            background: rgba(0,0,0,0.05);
        }
        .card-dropdown {
            position: absolute;
            top: 36px;
            right: 8px;
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            display: none;
            flex-direction: column;
            min-width: 130px;
            overflow: hidden;
            z-index: 20;
            font-style: normal;
            font-size: 0.9rem;
        }
        .card-dropdown.active {
            display: flex;
        }
        .card-dropdown button {
            background: none;
            border: none;
            padding: 10px 14px;
            text-align: left;
            font-size: 0.9rem;
            cursor: pointer;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            font-family: inherit;
        }
        .card-dropdown button:last-child {
            border-bottom: none;
        }
        .card-dropdown button:active {
            background: rgba(0,0,0,0.06);
        }
        body.dark-mode .card-dropdown button:active {
            background: rgba(255,255,255,0.08);
        }
        .card-dropdown button.btn-delete-opt {
            color: #ff4757;
        }

        /* Toast para aviso de copiado */
        #toast-notice {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 10px 22px;
            border-radius: 25px;
            font-size: 0.95rem;
            font-weight: 600;
            z-index: 3000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            box-shadow: 0 6px 18px rgba(0,0,0,0.3);
        }
        #toast-notice.visible {
            opacity: 1;
        }
        body.dark-mode #toast-notice {
            background: rgba(255, 255, 255, 0.92);
            color: #121212;
        }

        @keyframes highlightPulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); box-shadow: 0 0 20px var(--max-dark); } 100% { transform: scale(1); } }
        .highlight-item > .content-tl, .highlight-item.quote-card { animation: highlightPulse 2s ease; }
        #add-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(3px); }
        .modal-content { background: var(--card-bg); padding: 25px; border-radius: 20px; width: 85%; max-width: 400px; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; }
        .form-group input, .form-group select, .form-group textarea { padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); font-size: 1rem; background: var(--input-bg); color: var(--text-main); }
        .btn-row { display: flex; justify-content: space-between; margin-top: 25px; gap: 10px;}
        .btn-row button { padding: 14px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; flex: 1;}
        .btn-save { background: linear-gradient(90deg, var(--lia-dark), var(--max-dark)); color: white; }
        .btn-cancel { background: var(--border-color); color: var(--text-main); }
    </style>
</head>
<body>

    <div id="scroll-indicator">Oct 2025</div>
    <div id="toast-notice">Copiado al portapapeles</div>

    <!-- 1. Pantalla de Login -->
    <div id="login-screen">
        <div class="login-card">
            <h2>¡Hola Familia! 👋</h2>
            <p>Introduce la contraseña para entrar al diario.</p>
            <input type="password" id="pass-input" placeholder="Contraseña">
            <button id="login-btn" onclick="checkLogin()">Acceder</button>
        </div>
    </div>

    <!-- 2. Pantalla Principal -->
    <div id="home-screen" class="screen hidden">
        <header>
            <div style="width: 40px;"></div>
            <h1>MiniBitácora</h1>
            <button class="icon-btn" style="width: 40px;" onclick="toggleDarkMode()" title="Cambiar tema">🌓</button>
        </header>
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" class="search-input" placeholder="Buscar palabras, fechas..." oninput="doSearch()">
            <div id="search-results"></div>
        </div>
        <div class="big-card" id="card-timeline" onclick="showScreen('timeline-screen')">
            <h2 style="font-size: 2.5rem; margin-bottom: 5px;">📅</h2>
            <h2>Cronología</h2>
            <p>Sus primeros pasos, dientes y logros</p>
        </div>
        <div class="big-card" id="card-quotes" onclick="showScreen('quotes-screen')">
            <h2 style="font-size: 2.5rem; margin-bottom: 5px;">💬</h2>
            <h2>Frases Célebres</h2>
            <p>Ocurrencias que no queremos olvidar</p>
        </div>
    </div>

    <!-- 3. Pantalla Cronología -->
    <div id="timeline-screen" class="screen hidden">
        <header>
            <button class="icon-btn" style="width: 40px; text-align: left;" onclick="showScreen('home-screen')">🔙</button>
            <h2 class="header-title-small">Cronología</h2>
            <button class="icon-btn" style="width: 40px; text-align: right;" onclick="toggleDarkMode()" title="Cambiar tema">🌓</button>
        </header>
        <div class="timeline" id="timeline-container"></div>
    </div>

    <!-- 4. Pantalla Frases -->
    <div id="quotes-screen" class="screen hidden">
        <header>
            <button class="icon-btn" style="width: 40px; text-align: left;" onclick="showScreen('home-screen')">🔙</button>
            <h2 class="header-title-small">Frases Célebres</h2>
            <button class="icon-btn" style="width: 40px; text-align: right;" onclick="toggleDarkMode()" title="Cambiar tema">🌓</button>
        </header>
        <div class="quotes-grid" id="quotes-container"></div>
    </div>

    <button id="fab" class="hidden" onclick="openModal()">+</button>

    <!-- Modal Añadir / Editar -->
    <div id="add-modal" class="hidden">
        <div class="modal-content">
            <h2 id="modal-title" style="margin-top:0; text-align: center;">Añadir Recuerdo</h2>
            <input type="hidden" id="edit-entry-id" value="">
            <div class="form-group"><label>¿Qué vas a guardar?</label><select id="input-type"><option value="hito">📅 Un Hito</option><option value="frase">💬 Una Frase</option></select></div>
            <div class="form-group"><label>¿Quién es el protagonista?</label><select id="input-child"><option value="lia">👧 Lía</option><option value="max">👦 Max</option></select></div>
            <div class="form-group"><label>Escribe aquí...</label><textarea id="input-text" rows="3"></textarea></div>
            <div class="form-group">
                <label>Mes y Año (Orden)</label>
                <input type="text" id="input-sort-date" placeholder="MM/AAAA (ej: 03/2025)" maxlength="7" inputmode="numeric" oninput="formatMonthYear(this)" required>
            </div>
            <div class="form-group"><label>Texto de la fecha (Opcional)</label><input type="text" id="input-display-date" placeholder="Ej: 'A los 7 meses'"></div>
            <div class="btn-row">
                <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
                <button class="btn-save" id="save-btn" onclick="saveData()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- --- JAVASCRIPT --- -->
    <script>
        const SUPABASE_URL = 'https://dwltmdxtnzdgbfruxxbd.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_9KbD50_bHQ6xYVHV-D_SJw_JdLu9IEP';
        
        let supabaseClient = null;
        let db = [];

        try {
            if (window.supabase && window.supabase.createClient) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                    global: {
                        headers: {
                            apikey: SUPABASE_ANON_KEY
                        }
                    }
                });
            }
        } catch (e) {
            console.error('Error al inicializar cliente Supabase:', e);
        }

        // Modo Oscuro
        function updateThemeMeta(isDark) {
            const color = isDark ? '#121212' : '#f4f7f6';
            const metaTheme = document.getElementById('theme-color-meta');
            if (metaTheme) metaTheme.setAttribute('content', color);
            document.documentElement.style.backgroundColor = color;
            document.body.style.backgroundColor = color;
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark-mode');
            const isDark = document.documentElement.classList.contains('dark-mode');
            localStorage.setItem('kidsAppTheme', isDark ? 'dark' : 'light');
            updateThemeMeta(isDark);
        }

        const isDarkOnInit = localStorage.getItem('kidsAppTheme') === 'dark' || (!localStorage.getItem('kidsAppTheme') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDarkOnInit) {
            document.documentElement.classList.add('dark-mode');
        }
        updateThemeMeta(isDarkOnInit);

        // Login
        document.getElementById('pass-input').addEventListener('keypress', function (e) { 
            if (e.key === 'Enter') checkLogin(); 
        });

        async function checkLogin() {
            const pass = document.getElementById('pass-input').value;
            if (pass !== '5588') {
                alert('Contraseña incorrecta.');
                return;
            }

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('home-screen').classList.remove('hidden');
            document.getElementById('fab').classList.remove('hidden');

            await loadMemoriesFromCloud();
        }

        async function loadMemoriesFromCloud() {
            if (!supabaseClient) {
                console.warn('Supabase no disponible, funcionando en local.');
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('memories')
                    .select('*');

                if (error) {
                    alert('Aviso de base de datos: ' + (error.message || JSON.stringify(error)));
                    console.error('Error al leer Supabase:', error);
                } else {
                    db = data || [];
                    renderViews();
                }
            } catch (err) {
                console.error('Error de red al consultar Supabase:', err);
            }
        }

        // Navegación
        function showScreen(screenId) {
            closeAllDropdowns();
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');
            if (screenId !== 'home-screen') {
                document.getElementById('search-input').value = '';
                document.getElementById('search-results').innerHTML = '';
            }
            renderViews();
            window.scrollTo(0, 0);
        }

        // Formateo de fecha MM/AAAA en el input
        function formatMonthYear(input) {
            let val = input.value.replace(/\D/g, '');
            if (val.length > 2) {
                input.value = val.substring(0, 2) + '/' + val.substring(2, 6);
            } else {
                input.value = val;
            }
        }

        // Convertir YYYY-MM a MM/YYYY para mostrar en el formulario
        function isoToMmYyyy(iso) {
            if (!iso || !iso.includes('-')) return '';
            const [y, m] = iso.split('-');
            return `${m}/${y}`;
        }

        // Modal
        function openModal(editItem = null) {
            closeAllDropdowns();
            const modalTitle = document.getElementById('modal-title');
            const editIdInput = document.getElementById('edit-entry-id');

            if (editItem) {
                modalTitle.innerText = 'Modificar Recuerdo';
                editIdInput.value = editItem.id;
                document.getElementById('input-type').value = editItem.type;
                document.getElementById('input-child').value = editItem.child;
                document.getElementById('input-text').value = editItem.text;
                document.getElementById('input-sort-date').value = isoToMmYyyy(editItem.sort_date);
                document.getElementById('input-display-date').value = editItem.display_date || '';
            } else {
                modalTitle.innerText = 'Añadir Recuerdo';
                editIdInput.value = '';
                const today = new Date();
                const mm = String(today.getMonth() + 1).padStart(2, '0');
                const yyyy = today.getFullYear();
                document.getElementById('input-sort-date').value = `${mm}/${yyyy}`;
                document.getElementById('input-text').value = '';
                document.getElementById('input-display-date').value = '';
            }

            document.getElementById('add-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('add-modal').classList.add('hidden');
            document.getElementById('edit-entry-id').value = '';
            document.getElementById('input-text').value = '';
            document.getElementById('input-display-date').value = '';
        }

        // Guardar Datos (Crear o Actualizar)
        async function saveData() {
            const editId = document.getElementById('edit-entry-id').value;
            const type = document.getElementById('input-type').value;
            const child = document.getElementById('input-child').value;
            const text = document.getElementById('input-text').value.trim();
            const rawDate = document.getElementById('input-sort-date').value.trim();
            let display_date = document.getElementById('input-display-date').value.trim();

            if (!text || !rawDate) { 
                alert('Rellena al menos el texto y el Mes/Año.'); 
                return; 
            }

            // Validar y convertir MM/AAAA a YYYY-MM
            let sort_date = '';
            if (rawDate.includes('/')) {
                const parts = rawDate.split('/');
                const m = parseInt(parts[0], 10);
                const y = parseInt(parts[1], 10);
                if (m >= 1 && m <= 12 && parts[1].length === 4 && y >= 1900) {
                    sort_date = `${parts[1]}-${String(m).padStart(2, '0')}`;
                }
            } else if (rawDate.includes('-') && rawDate.length === 7) {
                sort_date = rawDate;
            }

            if (!sort_date) {
                alert('El formato de fecha debe ser MM/AAAA (por ejemplo: 03/2025).');
                return;
            }

            if (!display_date) display_date = rawDate;

            const saveBtn = document.getElementById('save-btn');
            saveBtn.innerText = 'Guardando...';
            saveBtn.disabled = true;

            const payload = { type, child, text, sort_date, display_date };

            // Modo sin cliente Supabase (local)
            if (!supabaseClient) {
                if (editId) {
                    const idx = db.findIndex(item => String(item.id) === String(editId));
                    if (idx !== -1) db[idx] = { ...db[idx], ...payload };
                } else {
                    payload.id = Date.now();
                    db.push(payload);
                }
                closeModal();
                renderViews();
                saveBtn.innerText = 'Guardar';
                saveBtn.disabled = false;
                return;
            }

            // Modo con Supabase
            try {
                if (editId) {
                    const { data, error } = await supabaseClient
                        .from('memories')
                        .update(payload)
                        .eq('id', editId)
                        .select();

                    if (error) {
                        alert('Error al modificar: ' + error.message);
                    } else if (data && data.length > 0) {
                        const idx = db.findIndex(item => String(item.id) === String(editId));
                        if (idx !== -1) db[idx] = data[0];
                        closeModal();
                        renderViews();
                    }
                } else {
                    const { data, error } = await supabaseClient
                        .from('memories')
                        .insert([payload])
                        .select();

                    if (error) {
                        alert('Error al guardar: ' + error.message);
                    } else if (data && data.length > 0) {
                        db.push(data[0]);
                        closeModal();
                        renderViews();
                    }
                }
            } catch (err) {
                alert('Error al conectar con la base de datos: ' + err.message);
                console.error(err);
            } finally {
                saveBtn.innerText = 'Guardar';
                saveBtn.disabled = false;
            }
        }

        // Borrar Datos
        async function deleteEntry(id, event) {
            if (event) event.stopPropagation();
            closeAllDropdowns();
            if (!confirm('¿Seguro que quieres borrar este recuerdo?')) return;

            if (supabaseClient) {
                try {
                    const { error } = await supabaseClient
                        .from('memories')
                        .delete()
                        .eq('id', id);

                    if (error) {
                        alert('Error al borrar: ' + error.message);
                        return;
                    }
                } catch (err) {
                    alert('Error al borrar: ' + err.message);
                    return;
                }
            }

            db = db.filter(item => String(item.id) !== String(id));
            renderViews();
        }

        // Editar entrada
        function editEntry(id, event) {
            if (event) event.stopPropagation();
            closeAllDropdowns();
            const item = db.find(it => String(it.id) === String(id));
            if (item) openModal(item);
        }

        // Copiar entrada formateada para WhatsApp
        async function copyEntry(id, event) {
            if (event) event.stopPropagation();
            closeAllDropdowns();
            const item = db.find(it => String(it.id) === String(id));
            if (!item) return;

            const nombre = item.child === 'lia' ? 'Lía' : 'Max';
            let formattedText = '';
            if (item.type === 'frase') {
                formattedText = `💬 "${item.text}"\n— ${nombre} (${item.display_date})`;
            } else {
                formattedText = `📅 *${nombre}* (${item.display_date}):\n${item.text}`;
            }

            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(formattedText);
                } else {
                    const ta = document.createElement('textarea');
                    ta.value = formattedText;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                }
                showToast('¡Copiado para WhatsApp! 📋');
            } catch (err) {
                console.error('Error al copiar:', err);
                showToast('No se pudo copiar');
            }
        }

        // Control del menú desplegable (⋮)
        function toggleCardMenu(id, event) {
            event.stopPropagation();
            const targetMenu = document.getElementById(`dropdown-${id}`);
            const wasActive = targetMenu && targetMenu.classList.contains('active');
            closeAllDropdowns();
            if (targetMenu && !wasActive) {
                targetMenu.classList.add('active');
            }
        }

        function closeAllDropdowns() {
            document.querySelectorAll('.card-dropdown').forEach(m => m.classList.remove('active'));
        }

        // Cierra los desplegables al tocar fuera
        document.addEventListener('click', () => closeAllDropdowns());

        // Notificación flotante (toast)
        let toastTimeout;
        function showToast(text) {
            const toast = document.getElementById('toast-notice');
            toast.innerText = text;
            toast.classList.add('visible');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('visible'), 2000);
        }

        // Buscador
        function doSearch() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const resultsContainer = document.getElementById('search-results');
            if (query.length < 2) { 
                resultsContainer.innerHTML = ''; 
                return; 
            }
            
            const results = db.filter(item => 
                (item.text && item.text.toLowerCase().includes(query)) || 
                (item.display_date && item.display_date.toLowerCase().includes(query))
            );
            
            if (results.length === 0) { 
                resultsContainer.innerHTML = '<div style="padding:15px; text-align:center;">No hay resultados</div>'; 
                return; 
            }

            resultsContainer.innerHTML = results.map(item => {
                const icono = item.type === 'hito' ? '📅' : '💬';
                const nombre = item.child === 'lia' ? 'Lía' : 'Max';
                const snippet = item.text.length > 40 ? item.text.substring(0, 40) + '...' : item.text;
                return `<div class="search-result-item" onclick="goToItem(${item.id}, '${item.type}')">
                    <div style="font-size: 0.8rem; margin-bottom:5px;">${icono} ${nombre.toUpperCase()} - ${item.display_date}</div>
                    <div>${snippet}</div></div>`;
            }).join('');
        }

        function goToItem(id, type) {
            showScreen(type === 'hito' ? 'timeline-screen' : 'quotes-screen');
            setTimeout(() => {
                const element = document.getElementById(`item-${id}`);
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    element.classList.add('highlight-item');
                    setTimeout(() => element.classList.remove('highlight-item'), 2500);
                }
            }, 100);
        }

        // Helper para crear el bloque HTML del menú de acciones
        function renderCardMenu(id) {
            return `
                <button class="card-menu-btn" onclick="toggleCardMenu(${id}, event)" title="Opciones">⋮</button>
                <div class="card-dropdown" id="dropdown-${id}">
                    <button onclick="copyEntry(${id}, event)">📋 Copiar</button>
                    <button onclick="editEntry(${id}, event)">✏️ Modificar</button>
                    <button class="btn-delete-opt" onclick="deleteEntry(${id}, event)">🗑️ Borrar</button>
                </div>
            `;
        }

        // Renderizado
        function renderViews() {
            const sortedDb = [...db].sort((a, b) => new Date(a.sort_date) - new Date(b.sort_date));

            const timelineContainer = document.getElementById('timeline-container');
            const hitos = sortedDb.filter(item => item.type === 'hito');
            if (hitos.length === 0) { 
                timelineContainer.innerHTML = '<p style="text-align:center;">No hay hitos guardados.</p>'; 
            } else {
                timelineContainer.innerHTML = hitos.map(item => `
                    <div class="container-tl scroll-item ${item.child}" id="item-${item.id}" data-date="${item.sort_date}">
                        <div class="content-tl">
                            ${renderCardMenu(item.id)}
                            <div class="date-badge">${item.display_date}</div>
                            <div>${item.text}</div>
                        </div>
                    </div>`).join('');
            }

            const quotesContainer = document.getElementById('quotes-container');
            const frases = sortedDb.filter(item => item.type === 'frase');
            if (frases.length === 0) { 
                quotesContainer.innerHTML = '<p style="text-align:center;">No hay frases guardadas.</p>'; 
            } else {
                quotesContainer.innerHTML = frases.map(item => `
                    <div class="quote-card scroll-item ${item.child}" id="item-${item.id}" data-date="${item.sort_date}">
                        ${renderCardMenu(item.id)}
                        " ${item.text} " 
                        <div class="quote-author">- ${item.child.toUpperCase()} (${item.display_date})</div>
                    </div>`).reverse().join('');
            }
        }

        // Indicador de Scroll
        let scrollTimeout; 
        const months = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
        window.addEventListener('scroll', () => {
            const activeScreen = document.querySelector('.screen:not(.hidden)');
            if (!activeScreen || activeScreen.id === 'home-screen' || activeScreen.id === 'login-screen') return;
            const items = activeScreen.querySelectorAll('.scroll-item');
            let currentItem = null;
            items.forEach(item => { 
                const rect = item.getBoundingClientRect(); 
                if (rect.top >= 0 && rect.top < 350) currentItem = item; 
            });
            if (currentItem) {
                const dateVal = currentItem.getAttribute('data-date');
                if (dateVal) {
                    const [year, month] = dateVal.split('-');
                    const indicator = document.getElementById('scroll-indicator');
                    indicator.innerText = `${months[parseInt(month)-1]} ${year}`;
                    indicator.classList.add('visible');
                    clearTimeout(scrollTimeout);
                    scrollTimeout = setTimeout(() => indicator.classList.remove('visible'), 1500);
                }
            }
        });
    </script>
</body>
</html>
